# ===================================================================
# Decap CMS configuration for Perth Beers
# This describes WHAT you can edit and HOW the forms look.
# ===================================================================

backend:
  name: github
  repo: kwmdesign/perth-beers-site   # your GitHub repository
  branch: main                        # edits are saved to this branch (goes live)

# Where uploaded images are stored / referenced from
media_folder: "src/assets"
public_folder: "/assets"

# Branding: shows the real Perth Beers logo in the CMS header, and adds a
# "View Site" link back to the live site in the top bar.
site_url: "https://www.perthbeers.au/"
display_url: "https://www.perthbeers.au/"
logo:
  src: "/assets/perth-beers-logo.png"
  show_in_header: true

collections:
  # ---------- BEERS ----------
  - name: "beers"
    label: "Beers"
    files:
      - name: "beerlist"
        label: "Beer Listing"
        file: "src/_data/beers.json"
        description: "The beers shown in the slider. Add, edit, delete, or drag to reorder."
        fields:
          - name: items
            label: "Beers"
            label_singular: "Beer"
            widget: list
            summary: "{{fields.name}} — {{fields.brewery}}"
            fields:
              - name: name
                label: "Beer Name"
                widget: string
                hint: "The specific beer, e.g. \"Single Fin\" — not the brewery."
              - name: brewery
                label: "Brewery"
                widget: string
                hint: "Who brews it, e.g. \"Gage Roads Brew Co\"."
              - name: type
                label: "Beer Type / Style"
                widget: string
                hint: "e.g. Pale Ale, IPA, Lager, Wheat Beer, Pilsner."
              - name: region
                label: "Region"
                widget: select
                hint: "Which patch it's grouped under on the site's filter buttons."
                options:
                  - { label: "Fremantle", value: "fremantle" }
                  - { label: "South Perth", value: "southperth" }
                  - { label: "Swan Valley", value: "swanvalley" }
                  - { label: "Inner City", value: "innercity" }
                  - { label: "Coastal North", value: "coastal" }
              - name: link
                label: "Brewery Website"
                widget: string
                hint: "Full URL starting with https:// — this is where the card links out to."
                pattern: ['^https://.+', "Must start with https://"]

  # ---------- SWAN VALLEY TRAIL ----------
  - name: "trail"
    label: "Swan Valley Trail"
    files:
      - name: "traillist"
        label: "Trail Stops"
        file: "src/_data/trail.json"
        description: "The Swan Valley trail stops. Drag to reorder — they number themselves 1, 2, 3… automatically."
        fields:
          - name: items
            label: "Stops"
            label_singular: "Stop"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Brewery / Venue Name", widget: string }
              - { name: place, label: "Location / Sub-label", widget: string }
              - { name: bestFor, label: "Best For (short line)", widget: string }
